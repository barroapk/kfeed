name: V2
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Calculer le jour même avant 05:00 UTC'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: v2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KD_KEY: ${{ secrets.KD_KEY }}
      PK_KEY: ${{ secrets.PK_KEY }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: barroapk/kounadia-engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Etat precedent
        run: |
          mkdir -p data out
          node scripts/kio.mjs pull scores scores.json
          node scripts/kio.mjs pull markets markets.json
          node scripts/kio.mjs pull v2 v2_state.json fd.json
          # Pronostics Expert (analystes) du jour, pour la Sélection.
          node scripts/kio.mjs pull pronos today_p.json
          if [ -f data/today_p.json ]; then mv -f data/today_p.json data/today.json; fi
      - name: football-data (source de secours)
        run: node scripts/v2/fd.mjs data/fd.json || true
      - name: Calcul
        run: node scripts/v2/engine.mjs
        env:
          V2_FORCE: ${{ inputs.force && '1' || '0' }}
      - name: Publier
        run: |
          mkdir pub
          cp out/v2.json out/v2_p.json out/v2_state.json pub/
          [ -f data/fd.json ] && cp data/fd.json pub/ || true
          [ -f out/ligues.json ] && cp out/ligues.json pub/ || true
          PRIVATE=v2_p.json,v2_state.json node scripts/kio.mjs seal pub
          cd pub
          git init -q
          git checkout -q -b v2
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "maj $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" v2
      - name: Pub du jour (images des 8 h GMT, puis resultats)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 -b pub "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" pubimg 2>/dev/null || mkdir -p pubimg
          if [ "$(node scripts/v2/pub.mjs --check)" != "1" ]; then echo "Pub du jour : rien a faire"; exit 0; fi
          npm i --no-save --no-audit --no-fund playwright-core@1.47.2 >/dev/null
          node scripts/v2/pub.mjs
          [ -f pubimg/latest.json ] || exit 0
          cd pubimg
          rm -rf .git
          git init -q
          git checkout -q -b pub
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "pub $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" pub
