name: Backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KD_KEY: ${{ secrets.KD_KEY }}
      REPO: ${{ github.repository }}
      OLD: barroapk/kounadia-data
    steps:
      - uses: actions/checkout@v4
        with:
          repository: barroapk/kounadia-engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Etat precedent
        run: |
          mkdir -p data out
          node scripts/kio.mjs pull archive archive.json
      - name: Calcul
        run: node scripts/backtest.mjs > /dev/null
      - name: Publier
        run: |
          mkdir pub
          cp out/archive.json out/backtest.json out/vip_params.json pub/
          node scripts/kio.mjs seal pub
          cd pub
          git init -q
          git checkout -q -b archive
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "maj $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" archive
