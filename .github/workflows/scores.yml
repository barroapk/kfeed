name: Scores
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scores
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KD_KEY: ${{ secrets.KD_KEY }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: barroapk/kounadia-engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Etat precedent
        run: |
          mkdir -p data out
          # Catalogue des championnats footlive (gardé d'un passage à l'autre).
          curl -sf https://raw.githubusercontent.com/barroapk/kfeed/flcat/flcat.json -o data/flcat.json || true
          # Temps forts déjà trouvés (vidéos YouTube officielles des grands matchs).
          curl -sf https://raw.githubusercontent.com/barroapk/kfeed/hl/hl.json -o data/hl.json || true
      - name: Calcul
        run: node scripts/primatips.mjs > /dev/null
      - name: Publier
        run: |
          mkdir pub
          cp out/scores.json pub/
          node scripts/kio.mjs seal pub
          cd pub
          git init -q
          git checkout -q -b scores
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "maj $(date -u +%FT%H:%MZ)"
          # GitHub répond parfois « Internal Server Error » : 3 essais avant d'abandonner.
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" scores && break; [ "$i" = 3 ] && exit 1; sleep $((i * 15)); done
      - name: Catalogue footlive
        run: |
          [ -f out/flcat.json ] || exit 0
          mkdir cat
          cp out/flcat.json cat/
          cd cat
          git init -q
          git checkout -q -b flcat
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "maj $(date -u +%FT%H:%MZ)"
          # GitHub répond parfois « Internal Server Error » : 3 essais avant d'abandonner.
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" flcat && break; [ "$i" = 3 ] && exit 1; sleep $((i * 15)); done
      - name: Temps forts
        run: |
          [ -f scripts/hl.mjs ] || exit 0
          node scripts/hl.mjs || true
          [ -f out/hl.json ] || exit 0
          mkdir hlp
          cp out/hl.json hlp/
          cd hlp
          git init -q
          git checkout -q -b hl
          git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "maj $(date -u +%FT%H:%MZ)"
          # GitHub répond parfois « Internal Server Error » : 3 essais avant d'abandonner.
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hl && break; [ "$i" = 3 ] && exit 1; sleep $((i * 15)); done
